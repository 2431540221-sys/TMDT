<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Secondhand Market</title>
  <link rel="stylesheet" href="style.css" />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600&display=swap" rel="stylesheet" />
</head>
<body>
  <!-- Header -->
  <header class="header">
    <img src="C:/Users/Administrator/.gemini/antigravity/brain/e325ab2f-d3bc-4fc5-b8fd-34c1c292c012/logo_placeholder_1793020675226.png" alt="Logo" class="logo" />
    <nav class="nav">
      <a href="#">Home</a>
      <a href="#">Categories</a>
      <a href="#">Sell</a>
      <a href="#">Contact</a>
    </nav>
  </header>

  <!-- Hero / Search -->
  <section class="hero">
    <h1>Marketplace Đồ Cũ</h1>
    <p>Mua bán nhanh, an toàn, giá tốt</p>
    <div class="search-wrapper">
      <input type="text" placeholder="Tìm kiếm sản phẩm..." class="search-input" />
      <button class="search-btn">Tìm</button>
    </div>
  </section>

  <!-- Product Grid -->
  <section class="products">
    <h2>Sản phẩm nổi bật</h2>
    <div class="grid">
      <!-- Example card, duplicate as needed -->
      <div class="card">
        <img src="https://via.placeholder.com/300x200" alt="Product" />
        <div class="card-body">
          <h3>Áo Thun</h3>
          <p class="price">200.000₫</p>
        </div>
      </div>
      <div class="card">
        <img src="https://via.placeholder.com/300x200" alt="Product" />
        <div class="card-body">
          <h3>Giày Thể Thao</h3>
          <p class="price">350.000₫</p>
        </div>
      </div>
      <div class="card">
        <img src="https://via.placeholder.com/300x200" alt="Product" />
        <div class="card-body">
          <h3>Balo Du Lịch</h3>
          <p class="price">500.000₫</p>
        </div>
      </div>
    </div>
  </section>

  <!-- Footer -->
  <footer class="footer">
    <p>© 2026 Secondhand Market. All rights reserved.</p>
  </footer>

  <script src="script.js"></script>
</body>
</html>
